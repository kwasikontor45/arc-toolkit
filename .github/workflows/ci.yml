name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: install Tk bindings for panel tests
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y python3-tk

      - name: check tracked shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            first_line=""
            IFS= read -r first_line < "$file" || true
            if [[ "$first_line" == '#!'* && "$first_line" =~ (bash|sh)([[:space:]]|$) ]]; then
              bash -n "$file"
            fi
          done < <(git ls-files -z -- '*.sh' '*.bash' bin)

      - name: report Python version
        run: python3 --version

      - name: test calendar state
        run: python3 -m unittest discover -s tests -p 'test_hub_calendar.py' -v

      - name: test Garage health and report sanitization
        run: python3 -m unittest discover -s tests -p 'test_garage_health.py' -v

      - name: test Garage route and CSP
        run: python3 -m unittest discover -s tests -p 'test_hub_garage_routes.py' -v

      - name: test notification audio
        run: python3 -m unittest discover -s tests -p 'test_notification_audio.py' -v

      - name: test SOP banner
        run: python3 -m unittest discover -s tests -p 'test_sop_banner.py' -v

      - name: test timer recovery
        run: python3 -m unittest discover -s tests -p 'test_timer_recovery.py' -v

      - name: test word of day
        run: python3 -m unittest discover -s tests -p 'test_word_of_day.py' -v
